[package]
name = "stellar-insured-slashing"
version = "1.0.0"
authors = ["Stellar Insured Team"]
edition = "2021"
description = "Slashing and penalty contract for Stellar Insured"
license = "MIT"
publish = false

[dependencies]
soroban-sdk = { workspace = true }
stellar-insured-lib = { path = "../lib" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
kani = { workspace = true, optional = true }
proptest = { workspace = true, optional = true }

[lib]
name = "stellar_insured_slashing"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["std"]
std = ["soroban-sdk/testutils"]
testutils = ["soroban-sdk/testutils"]
verification = ["kani", "proptest", "stellar-insured-lib/verification"]
