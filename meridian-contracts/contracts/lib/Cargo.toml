[package]
name = "stellar-insured-lib"
version = "1.0.0"
authors = ["Stellar Insured Team"]
edition = "2021"
description = "Shared library for Stellar Insured smart contracts"
license = "MIT"
publish = false

[dependencies]
soroban-sdk = { workspace = true }

[dependencies.kani]
version = "0.60"
workspace = true
optional = true

[dependencies.prusti-contracts]
version = "0.6"
workspace = true
optional = true

[features]
default = ["std"]
std = ["soroban-sdk/std"]
verification = ["std", "kani", "prusti-contracts"]

[lib]
name = "stellar_insured_lib"
path = "src/lib.rs"
crate-type = ["rlib"]